name: Monthly Portfolio Report

on:
  schedule:
    # 1st of every month at 04:00 UTC  →  09:30 AM IST
    - cron: '0 4 1 * *'
  workflow_dispatch:   # manual trigger from Actions tab

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
      KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
      KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
      GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
      GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
      GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Portfolio Monitor
        run: python main.py
